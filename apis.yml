aid: yanyin
name: Yanyin Technology
description: >-
  Yanyin Technology (衍因科技) is a Shanghai-based biomedical AI company building
  衍因智研云 (Yanyin Zhiyun), a digital research-collaboration platform for
  life-sciences R&D. Its product suite spans an electronic lab notebook (Yan
  Note), molecular biology tools (Yan Molecule), a LIMS (Yan LIMS), AI
  literature and experiment assistants (Yan Research, Yan Reviewer, Yan
  Advisor), and the enterprise AI MEGASphere platform, whose Mega Open Platform
  exposes an API gateway (API Key and OAuth2 client-credentials authentication,
  rate limiting, request signing, idempotency and retries, versioning), a
  developer center with online docs, SDKs and a sandbox, and webhook callback
  management with HMAC signing and event replay. Yanyin serves 80+ pharma
  companies, 280+ research institutions and hospitals, and 430+ universities,
  and holds ISO 9001, ISO 27001 and ISO 20000 certifications plus China MLPS
  Level 3. Backed by Qiming Venture Partners.
